# Veröffentlicht den Ordner app/ auf GitHub Pages – nur wenn alle Tests bestehen.
name: App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1. Testen und Paket bauen
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests (inkl. Manipulationsversuche)
        run: npm test
      - name: Offline-Dateiliste erzeugen
        run: node tools/build-sw.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  # 2. Veröffentlichen (eigener Schritt – so empfiehlt es GitHub; das Paket ist dann sicher verfügbar)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
